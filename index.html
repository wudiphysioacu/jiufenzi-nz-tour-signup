<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紐西蘭遊學說明會線上報名</title>
<meta name="description" content="臺南市立九份子國民中小學 2027 暑假紐西蘭遊學八月團說明會，線上報名導引頁。">
<style>
  :root{
    --sky:#8fd0f5; --sky-deep:#2f7fc1; --cloud:#ffffff;
    --grass:#7cc06e; --grass-deep:#4c9a46;
    --navy:#1d3b5e; --sun:#f7c948; --sun-edge:#d9a92a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    color:var(--navy);
    line-height:1.6;
    background:linear-gradient(180deg,var(--sky) 0,#e6f5ff 380px,#f7fbff 100%);
    min-height:100vh;
    overflow-x:hidden;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  .hero{position:relative;text-align:center;padding:44px 0 26px;overflow:hidden}
  .cloud{position:absolute;background:var(--cloud);border-radius:999px;pointer-events:none}
  .cloud::before,.cloud::after{content:"";position:absolute;background:var(--cloud);border-radius:50%}
  .cloud::before{width:56%;height:190%;left:16%;top:-95%}
  .cloud::after{width:40%;height:150%;left:50%;top:-70%}
  .cloud.a{width:120px;height:36px;left:-18px;top:34px}
  .cloud.b{width:90px;height:30px;right:-12px;top:96px}
  .cloud.c{width:70px;height:24px;left:24%;top:170px;opacity:.7}
  .kicker{position:relative;display:inline-block;background:var(--cloud);color:var(--sky-deep);font-size:14px;font-weight:700;padding:4px 14px;border-radius:999px}
  h1{position:relative;font-size:34px;line-height:1.25;margin:14px 0 6px;color:var(--navy)}
  .sub{position:relative;margin:0;font-size:17px;font-weight:700;color:var(--sky-deep)}
  .tags{position:relative;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  .tag{background:#fff;color:var(--navy);font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(29,59,94,.12)}
  .card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 12px 30px rgba(29,59,94,.14);margin-top:8px}
  .card h2{font-size:18px;margin:0 0 10px;color:var(--sky-deep)}
  .row{display:flex;gap:12px;padding:10px 0;border-top:1px dashed #cfe3f3}
  .row:first-of-type{border-top:0}
  .row dt{flex:0 0 74px;font-size:14px;color:#557;font-weight:700}
  .row dd{margin:0;font-size:16px;font-weight:700;color:var(--navy)}
  .btn{display:block;margin-top:20px;text-align:center;background:var(--sun);color:var(--navy);font-size:19px;font-weight:800;text-decoration:none;padding:16px 18px;border-radius:16px;box-shadow:0 6px 0 var(--sun-edge)}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--sun-edge)}
  .btn:focus-visible{outline:3px solid var(--sky-deep);outline-offset:3px}
  .note{font-size:14px;color:#4d6480;margin:14px 2px 0;text-align:center}
  .ground{margin-top:32px;background:linear-gradient(180deg,var(--grass),var(--grass-deep));color:#fff;text-align:center;padding:34px 16px 28px;border-radius:50% 50% 0 0 / 30px 30px 0 0}
  .ground p{margin:6px 0;font-size:14px}
  .ground strong{font-size:15px}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <span class="cloud a" aria-hidden="true"></span>
    <span class="cloud b" aria-hidden="true"></span>
    <span class="cloud c" aria-hidden="true"></span>
    <span class="kicker">臺南市立九份子國民中小學</span>
    <h1>紐西蘭遊學說明會</h1>
    <p class="sub">2027 暑假・紐西蘭遊學八月團（7/29–8/19）</p>
    <div class="tags">
      <span class="tag">適合升國二～大一</span>
      <span class="tag">寄宿家庭</span>
      <span class="tag">公立學校交流</span>
    </div>
  </header>

  <section class="card" aria-labelledby="info-title">
    <h2 id="info-title">說明會資訊</h2>
    <dl>
      <div class="row"><dt>說明會</dt><dd>2026/12/03（四）晚上 7:30</dd></div>
      <div class="row"><dt>地點</dt><dd>本校二樓會議室</dd></div>
      <div class="row"><dt>線上報名</dt><dd>截止 11/27（五）23:59</dd></div>
      <div class="row"><dt>紙本回條</dt><dd>11/27（五）前交回教務處</dd></div>
      <div class="row"><dt>聯絡</dt><dd>教務處 徐子惠組長</dd></div>
    </dl>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbw1w9gWkc8Uxx13v8dZPpsF1fWXggTKYzs7C37fxMz4FaspwC9OMVWWCpoJU6u7MO6X/exec">線上預約說明會座位</a>
    <p class="note">座位有限，報名表單頁面上方會顯示剩餘座位。<br>紙本回條也請於 11/27（五）前交回教務處。</p>
  </section>

  <footer class="ground">
    <strong>有任何問題，請洽教務處</strong>
    <p>臺南市立九份子國民中小學 教務處</p>
    <p>個人資料的使用說明，請見報名表單上的同意欄。</p>
  </footer>
</main>
</body>
</html>
